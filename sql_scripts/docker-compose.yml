services:
  postgres_mpgu:
    image: postgres:15
    container_name: test
    restart: unless-stopped
    environment:
      POSTGRES_USER: igor
      POSTGRES_PASSWORD: Polst
      POSTGRES_DB: postgres
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin_mpgu:
    image: dpage/pgadmin4
    container_name: pgadmin_mpgu
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "5050:80"
    depends_on:
      - postgres_mpgu
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: